function calcAverage(produkt){

  let tage = {};

  historyData.forEach(h=>{

    let wert = produkt==="agf"
      ? (h.agf || 0)
      : (h.mlf || 0);

    if(wert<=0) return;

    if(!tage[h.datum])
      tage[h.datum] = 0;

    tage[h.datum] += wert;

  });

let werte = Object.entries(tage)
.sort((a,b)=>{

  let da = a[0].split(".").reverse().join("-");
  let db = b[0].split(".").reverse().join("-");

  return db.localeCompare(da);

})
.slice(0,14)
.map(e=>e[1]);

  if(werte.length===0)
    return 0;

  let total = 0;

  werte.forEach(v=> total += v);

  return total / werte.length;
}

function calcResttage(produkt){

  let avg = calcAverage(produkt);

  if(avg<=0) return 999;

  let tage =
  lagerData[produkt].bestand / avg;

  if(tage < 0)
    return 0;

  return tage;
}

function getEasterSunday(year){

  let f = Math.floor,
  G = year % 19,
  C = f(year / 100),
  H = (C - f(C / 4) - f((8 * C + 13) / 25) + 19 * G + 15) % 30,
  I = H - f(H / 28) * (1 - f(29 / (H + 1)) * f((21 - G) / 11)),
  J = (year + f(year / 4) + I + 2 - C + f(C / 4)) % 7,
  L = I - J,
  month = 3 + f((L + 40) / 44),
  day = L + 28 - 31 * f(month / 4);

  return new Date(year, month - 1, day);
}

function formatHolidayDate(date){

  let tag =
  String(date.getDate()).padStart(2,"0");

  let monat =
  String(date.getMonth()+1).padStart(2,"0");

  return `${tag}.${monat}`;
}

function getFeiertage(year,bundesland){

  let easter =
  getEasterSunday(year);

  let feiertage = [

    "01.01",
    "01.05",
    "03.10",
    "25.12",
    "26.12"

  ];

  function addDays(base,days){

    let d = new Date(base);

    d.setDate(d.getDate()+days);

    return formatHolidayDate(d);
  }

  feiertage.push(addDays(easter,-2)); // Karfreitag
  feiertage.push(addDays(easter,1));  // Ostermontag
  feiertage.push(addDays(easter,39)); // Himmelfahrt
  feiertage.push(addDays(easter,50)); // Pfingstmontag

  if([
    "Bayern",
    "Baden-Württemberg",
    "Hessen",
    "Nordrhein-Westfalen",
    "Rheinland-Pfalz",
    "Saarland"
  ].includes(bundesland)){

    feiertage.push(addDays(easter,60)); // Fronleichnam
  }

  return feiertage;
}

function isFeiertag(date){

  let jahr =
  date.getFullYear();

  let heute =
  formatHolidayDate(date);

  let feiertage =
  getFeiertage(
    jahr,
    globalCfg.bundesland
  );

  return feiertage.includes(heute);
}

function isWochenende(date){
  

  let tag = date.getDay();

  return tag===0 || tag===6;
}
  function isArbeitstag(date){

  if(isWochenende(date))
    return false;

  if(isFeiertag(date))
    return false;

  return true;
}

function addArbeitstage(starttage,arbeitstage){

  
  let d = new Date(starttage);

  let count = 0;

  while(count < arbeitstage){

    d.setDate(d.getDate()+1);

    if(isArbeitstag(d)){
      count++;
    }
  }

  return d;
}

  function getLeerDatum(produkt){
  let avg =
  calcAverage(produkt);

  if(avg<=0)
    return null;

  let tage =
  calcResttage(produkt);

  let d =
  new Date();

  d.setDate(
    d.getDate() +
    Math.floor(tage)
  );

  return d;
}

  function getBestellDatum(produkt){

  let leer =
  getLeerDatum(produkt);

  if(!leer)
    return null;

  let lieferzeit =
  lagerData[produkt].lieferzeit || 0;

  let d =
  new Date(leer);

  let count = 0;

  while(count < lieferzeit){

    d.setDate(d.getDate()-1);

    if(isArbeitstag(d)){
      count++;
    }
  }

  return d;
}

function buildRestBullen(){
  let el=document.getElementById("calc");
  let cow=data.kuehe.items;
  let total=0;
  cow.forEach(i=>total+=i.kg);

  let rest=data.restbullen.rest;
  let ziel=data.restbullen.ziel;

  let rows="";
let lauf = rest;
  

let bull = data.bullen.items;

cow.forEach(it=>{

  if(it.kg<=0) return;

  // AGF / MLF nur wenn bei Bullen vorhanden UND kg > 0
  if(it.type==="agf" || it.type==="mlf"){
    let exists = bull.some(b => b.type===it.type && b.kg>0);
    if(!exists) return;
  }

let bullItem = bull.find(b=>{
  if(it.type && b.type) return it.type===b.type;
  return b.name===it.name;
});

let soll = bullItem
  ? bullItem.kg * (data.restbullen.anz || ziel / (bullItem.kg||1))
  : 0;

let anteil = it.kg / total;
let ist = anteil * rest;

let diff = soll - ist;

let zeit = "-";
  
if(it.type==="agf")
zeit=`<span class="agf">${fmt(Math.abs(diff)/globalCfg.agfKg)}</span>`;

if(it.type==="mlf")
zeit=`<span class="mlf">${fmt(Math.abs(diff)/globalCfg.mlfKg)}</span>`;


  lauf += diff;
let summe = lauf;
  

  let cls = diff >= 0 ? "plus" : "minus";
  let sign = diff >= 0 ? "+" : "";

  let name =
    it.type==="agf" ? globalCfg.agfName :
    it.type==="mlf" ? globalCfg.mlfName :
    it.name;

rows += `
<tr>
<td>${name}</td>
<td>${ist.toFixed(1)}</td>
<td>${soll.toFixed(1)}</td>
<td>${zeit}</td>
<td class="${cls}">${summe.toFixed(1)}</td>
</tr>`;
});

function saveRestBullenHistory(){
 
  let eintrag = {

    id: Date.now()+Math.random().toString(36).substr(2,5),

    datum: getToday(),

    kategorie: "restbullen",

    tiere: data.restbullen.anz,

    gesamt: 0,

    agf: 0,

    mlf: 0,

    futter:[]
  };
let cow = data.kuehe.items;
let bull = data.bullen.items;

let total = 0;
cow.forEach(i => total += i.kg);

let rest = data.restbullen.rest;
let ziel = data.restbullen.ziel;

cow.forEach(it=>{

  if(it.kg<=0) return;

  if(it.type==="agf" || it.type==="mlf"){
    let exists = bull.some(b=>b.type===it.type && b.kg>0);
    if(!exists) return;
  }

  let bullItem = bull.find(b=>{
    if(it.type && b.type) return it.type===b.type;
    return b.name===it.name;
  });

  let soll = bullItem
    ? bullItem.kg * (data.restbullen.anz || ziel / (bullItem.kg||1))
    : 0;

  let anteil = it.kg / total;
  let ist = anteil * rest;

  let diff = soll - ist;

  if(diff <= 0) return;

  let name =
    it.type==="agf" ? globalCfg.agfName :
    it.type==="mlf" ? globalCfg.mlfName :
    it.name;

  eintrag.futter.push({
    name: name,
    kg: diff
  });

  eintrag.gesamt += diff;

  if(it.type==="agf"){
    eintrag.agf += diff;
    lagerData.agf.bestand -= diff;
  }

  if(it.type==="mlf"){
    eintrag.mlf += diff;
    lagerData.mlf.bestand -= diff;
  }

});
historyData.unshift(eintrag);

saveHistoryStorage();

buildCalc();

buildHistory();

}

function addLieferung(){

  let produkt =
  document.getElementById("liefer-produkt").value;

  let datum =
  document.getElementById("liefer-datum").value;

  let menge =
  num(document.getElementById("liefer-menge").value);

  if(menge<=0){

    alert("Menge fehlt");

    return;
  }

  let eintrag = {

    id:
    Date.now()+
    Math.random().toString(36).substr(2,5),

    produkt:produkt,

    datum:formatDateInput(datum),

    menge:menge
  };

  lieferungen.unshift(eintrag);

  lagerData[produkt].bestand += menge;

  saveLieferungen();

  saveLagerStorage();

  buildHistory();

  buildCalc();

}

function deleteLieferung(id){

  let eintrag =
  lieferungen.find(l=>l.id===id);

  if(!eintrag) return;

  lagerData[eintrag.produkt].bestand -=
  eintrag.menge;

  lieferungen =
  lieferungen.filter(l=>l.id!==id);

  saveLieferungen();

  saveLagerStorage();

  buildHistory();

  buildCalc();

}

function deleteHistory(id){

  let eintrag =
  historyData.find(h=>h.id===id);

  if(!eintrag) return;

  lagerData.agf.bestand +=
  eintrag.agf || 0;

  lagerData.mlf.bestand +=
  eintrag.mlf || 0;

  historyData =
  historyData.filter(h=>h.id!==id);

  saveHistoryStorage();

  saveLagerStorage();

  buildHistory();

  buildCalc();

}

  function getJahre(cat){

    ...new Set(

      historyData

      .filter(e=>
        e.kategorie===cat
      )

      .map(e=>
        e.datum.split(".")[2]
      )

    )

  ];

  return jahre.sort((a,b)=>b-a);

}
  function getMonate(cat,jahr){

  let monate = [

    ...new Set(

      historyData

      .filter(e=>
        e.kategorie===cat &&
        e.datum.split(".")[2]===jahr
      )

      .map(e=>
        e.datum.split(".")[1]
      )

    )

  ];

  return monate.sort((a,b)=>b-a);

}
  function getWochen(cat,jahr,monat){

  let logs = historyData.filter(e=>

    e.kategorie===cat &&
    e.datum.split(".")[2]===jahr &&
    e.datum.split(".")[1]===monat

  );

  let wochen = [

    ...new Set(

      logs.map(e=>{

        let tag =
        parseInt(
          e.datum.split(".")[0]
        );

        let start =
        Math.floor((tag-1)/7)*7+1;

        let ende =
        start+6;

        return (
          String(start).padStart(2,"0")
          + "."
          + monat
          + " - "
          + String(ende).padStart(2,"0")
          + "."
          + monat
        );

      })

    )

  ];

  return wochen;

}
  function getTage(cat,jahr,monat,woche){

  let teile =
  woche.split(" - ");

  let start =
  parseInt(
    teile[0].split(".")[0]
  );

  let ende =
  parseInt(
    teile[1].split(".")[0]
  );

  return historyData.filter(e=>{

    if(e.kategorie!==cat)
      return false;

    let d =
    e.datum.split(".");

    let tag =
    parseInt(d[0]);

    return (
      d[2]===jahr &&
      d[1]===monat &&
      tag>=start &&
      tag<=ende
    );

  });

}

let expr="",history=JSON.parse(localStorage.getItem("calcHist"))||[];

function press(v){
  if(v==="C"){expr="";update();return;}

  if(v==="⌫"){
    expr = expr.slice(0,-1);
    update();
    return;
  }

  if(v==="="){
    try{
      let r=eval(expr);
      history.unshift(expr+" = "+r);
      history=history.slice(0,20);
      localStorage.setItem("calcHist",JSON.stringify(history));
      expr=""+r;
    }catch{expr="";}
    update();renderHist();return;
  }

  expr+=v;
  update();
}

/* === ☁️ CLOUD-SPEICHER: Daten des Betriebs in Firestore ===
   Rechnen und Anzeigen bleiben unverändert. Die Speicherfunktionen (save, saveGlobal, saveHistoryStorage,
   saveLagerStorage, saveLieferungen) schreiben wie bisher in den localStorage und melden die Änderung hier an.
   Von hier geht sie gebündelt in den Betrieb:
     betriebe/{betriebId}/daten/futter | einstellungen | lager
     betriebe/{betriebId}/history/{id}       je Tageseintrag ein Dokument
     betriebe/{betriebId}/lieferungen/{id}   je Lieferung ein Dokument
   Änderungen anderer Geräte kommen über onSnapshot herein und werden angezeigt.
   Nur auf diesem Gerät bleiben: hiddenWarnings, historyCollapsed, Taschenrechner (calcHist). */

let betriebId = localStorage.getItem("betriebId") || null;
let geraeteUid = null;

const cloud = {
  aktiv:false,                 // true, sobald die Daten des Betriebs geladen sind
  offen:{},                    // geänderte Bereiche, die noch nicht an Firestore übergeben wurden
  timer:null,
  schreibtGerade:false,
  stand:{                      // zuletzt bekannter Stand in der Cloud
    history:new Map(),         // Dokument-ID → Sortierwert
    lieferungen:new Map(),
    lager:null
  },
  abos:[],
  wartetAufBlur:false
};

function kopie(o){ return o===undefined ? null : JSON.parse(JSON.stringify(o)); }

function cloudSpeichern(art){
  if(!cloud.aktiv) return;
  cloud.offen[art]=true;
  clearTimeout(cloud.timer);
  cloud.timer=setTimeout(cloudSchreiben,400);
  zeigeSyncStatus();
}

// Eindeutige Dokument-ID für einen History-/Lieferungs-Eintrag
function eintragDokIds(liste){
  const ids=[];
  const vergeben=new Set();
  liste.forEach(e=>{
    let id = (e && e.id!==undefined && e.id!==null) ? String(e.id) : "";
    if(!/^[A-Za-z0-9_-]{1,120}$/.test(id)){
      let h=0; const s=JSON.stringify(e);
      for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; }
      id="x"+(h>>>0).toString(36);
    }
    let eindeutig=id, n=2;
    while(vergeben.has(eindeutig)) eindeutig=id+"_"+(n++);
    vergeben.add(eindeutig);
    ids.push(eindeutig);
  });
  return ids;
}

// Lokale Änderungen in den Betrieb schreiben
function cloudSchreiben(){
  clearTimeout(cloud.timer);
  if(!cloud.aktiv || !betriebId) return;
  const offen=cloud.offen;
  cloud.offen={};
  const ref=db.collection("betriebe").doc(betriebId);
  const FV=firebase.firestore.FieldValue;
  const kopf={ geaendert:FV.serverTimestamp(), von:geraeteUid };
  const ops=[];

  if(offen.futter)
    ops.push(b=>b.set(ref.collection("daten").doc("futter"), {...kopf, inhalt:kopie(data)}));

  if(offen.einstellungen)
    ops.push(b=>b.set(ref.collection("daten").doc("einstellungen"), {...kopf, inhalt:kopie(globalCfg)}));

  if(offen.lager){
    const lagerDok=ref.collection("daten").doc("lager");
    const neu=kopie(lagerData)||{};
    const alt=cloud.stand.lager||{};   // gibt es noch kein Lager in der Cloud, zählt der Bestand dort als 0
    // Bestand als „Abziehen/Hinzufügen“ schicken, damit gleichzeitige Änderungen mehrerer Geräte nicht verloren gehen
    const inhalt={};
    new Set([...Object.keys(neu),...Object.keys(alt)]).forEach(p=>{
      if(!(p in neu)){ inhalt[p]=FV.delete(); return; }
      const n=neu[p], a=alt[p]||{};
      if(!n || typeof n!=="object"){ inhalt[p]=n; return; }
      const w={};
      new Set([...Object.keys(n),...Object.keys(a)]).forEach(k=>{
        if(!(k in n)) w[k]=FV.delete();
        else if(k==="bestand" && typeof n[k]==="number" && (typeof a[k]==="number" || !(k in a))){
          const delta=n[k]-(a[k]||0);
          if(delta!==0 || !(k in a)) w[k]=FV.increment(delta);
        }
        else if(JSON.stringify(n[k])!==JSON.stringify(a[k])) w[k]=n[k];
      });
      // Nur geänderte Produkte schicken – ein leeres {} würde beim Zusammenführen das ganze Produkt leeren
      if(Object.keys(w).length) inhalt[p]=w;
    });
    if(Object.keys(inhalt).length)
      ops.push(b=>b.set(lagerDok, {...kopf, inhalt}, {merge:true}));
    cloud.stand.lager=neu;
  }

  ["history","lieferungen"].forEach(art=>{
    if(!offen[art]) return;
    const liste = art==="history" ? historyData : lieferungen;
    const col=ref.collection(art);
    const ids=eintragDokIds(liste);
    const bekannt=cloud.stand[art];
    const neuIdx=[];
    ids.forEach((id,i)=>{ if(!bekannt.has(id)) neuIdx.push(i); });
    // Sortierwert: neueste oben (wie bisher unshift). Neue Einträge vorne → nur diese schreiben,
    // sonst (z. B. Backup geladen) Reihenfolge für alle neu festlegen.
    let maxS=0; bekannt.forEach(s=>{ if(s>maxS) maxS=s; });
    const basis=Math.max(Date.now()*1000, maxS+liste.length+1);
    const nurVorne=neuIdx.every((idx,k)=>idx===k);
    const neuStand=new Map();
    ids.forEach((id,i)=>{
      const istNeu=!bekannt.has(id);
      if(istNeu || !nurVorne){
        const s=basis-i;
        neuStand.set(id,s);
        const e=liste[i];
        ops.push(b=>b.set(col.doc(id), { e:kopie(e), s }));
      } else neuStand.set(id,bekannt.get(id));
    });
    bekannt.forEach((s,id)=>{ if(!neuStand.has(id)) ops.push(b=>b.delete(col.doc(id))); });
    cloud.stand[art]=neuStand;
  });

  if(!ops.length) return Promise.resolve();
  // in Paketen (Firestore erlaubt höchstens 500 Schreibvorgänge je Paket)
  const fertig=[];
  for(let i=0;i<ops.length;i+=400){
    const b=db.batch();
    ops.slice(i,i+400).forEach(f=>f(b));
    fertig.push(b.commit().catch(cloudFehler));
  }
  cloud.schreibtGerade=true;
  zeigeSyncStatus();
  db.waitForPendingWrites().then(()=>{ cloud.schreibtGerade=false; zeigeSyncStatus(); });
  return Promise.resolve();
}

// Wartet, bis alles bei Firestore angekommen ist (für Tests und vor dem Entfernen eines Geräts)
async function cloudSyncFertig(){
  cloudSchreiben();
  await db.waitForPendingWrites();
}

function cloudFehler(e){
  console.log("Cloud-Fehler:", e);
  if(e && e.code==="permission-denied") pruefeGeraetNochDa();
}

// Rationen laden – genau wie beim Start aus dem localStorage
function futterAusCloud(saved){
  saved = saved || {};
  return {
    kuehe: saved.kuehe||buildCat(100),
    faersen: saved.faersen||buildCat(30),
    restbullen: data.restbullen,   // Restmischung wird wie bisher nicht geladen
    bullen: saved.bullen||buildCat(10),
    trocken: saved.trocken||buildCat(5),
    kaelber: saved.kaelber||buildCat(20)
  };
}

function lagerStandard(){
  return { agf:{bestand:0,orange:5,rot:2,lieferzeit:2}, mlf:{bestand:0,orange:5,rot:2,lieferzeit:2} };
}

// Daten aus der Cloud übernehmen (art = futter | einstellungen | lager | history | lieferungen)
function cloudUebernehmen(art, wert){
  if(art==="futter"){
    data=futterAusCloud(wert);
    localStorage.setItem("futter",JSON.stringify(data));
  }
  if(art==="einstellungen"){
    globalCfg={...defaultGlobal, ...(wert||{})};
    localStorage.setItem("gCfg",JSON.stringify(globalCfg));
  }
  if(art==="lager"){
    const neu = wert ? kopie(wert) : lagerStandard();
    // Winzige Rundungsreste aus „Abziehen/Hinzufügen“ ignorieren → Anzeige bleibt Zeichen für Zeichen gleich
    ["agf","mlf"].forEach(p=>{
      if(neu[p] && lagerData[p] && typeof neu[p].bestand==="number" && typeof lagerData[p].bestand==="number"
         && Math.abs(neu[p].bestand-lagerData[p].bestand) < 1e-6) neu[p].bestand=lagerData[p].bestand;
    });
    lagerData=neu;
    cloud.stand.lager = wert ? kopie(lagerData) : null;
    localStorage.setItem("lager",JSON.stringify(lagerData));
  }
  if(art==="history" || art==="lieferungen"){
    const docs=wert.slice().sort((a,b)=> (b.s-a.s) || (a.id<b.id?-1:a.id>b.id?1:0));
    cloud.stand[art]=new Map(docs.map(d=>[d.id,d.s]));
    const liste=docs.map(d=>d.e);
    if(art==="history"){ historyData=liste; localStorage.setItem("history",JSON.stringify(historyData)); }
    else { lieferungen=liste; localStorage.setItem("lieferungen",JSON.stringify(lieferungen)); }
  }
}

// Neu zeichnen – aber nicht, während jemand gerade etwas eintippt
function neuZeichnen(){
  const a=document.activeElement;
  if(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && a.closest(".panel")){
    if(!cloud.wartetAufBlur){
      cloud.wartetAufBlur=true;
      a.addEventListener("blur",()=>{ cloud.wartetAufBlur=false; setTimeout(neuZeichnen,0); },{once:true});
    }
    return;
  }
  buildCalc();
  buildSettings();
  buildHistory();
  updateHistoryTabColor();
  baueBetriebBereich();
}

// Betrieb abonnieren. Liefert ein Promise, das erfüllt ist, wenn alle Bereiche einmal geladen sind.
function cloudAbonnieren(){
  const ref=db.collection("betriebe").doc(betriebId);
  const erst={};          // erster Stand je Bereich
  const arten=["futter","einstellungen","lager","history","lieferungen"];
  return new Promise((fertig,fehler)=>{
    let erledigt=false;
    const pruefeFertig=()=>{
      if(erledigt || !arten.every(a=>erst[a])) return;
      // Kommt alles nur aus einem leeren Zwischenspeicher (z. B. erster Start ohne Netz), auf den Server warten
      const alleAusCache=arten.every(a=>erst[a].ausCache);
      const cacheLeer=arten.every(a=>erst[a].leer);
      if(alleAusCache && cacheLeer){ arten.forEach(a=>{ delete erst[a]; }); zeigeSyncStatus("warte"); return; }
      erledigt=true;
      arten.forEach(a=>cloudUebernehmen(a, erst[a].wert));
      fertig();
    };
    const empfangen=(art, wert, meta, leer)=>{
      if(!erledigt){
        erst[art]={ wert, ausCache:meta.fromCache, leer };
        pruefeFertig();
        return;
      }
      // Eigene, noch unbestätigte Änderungen oder ungespeicherte lokale Änderungen: abwarten
      if(meta.hasPendingWrites || cloud.offen[art]) return;
      const vorher=JSON.stringify([data,globalCfg,lagerData,historyData,lieferungen]);
      cloudUebernehmen(art, wert);
      if(JSON.stringify([data,globalCfg,lagerData,historyData,lieferungen])!==vorher) neuZeichnen();
    };
    ["futter","einstellungen","lager"].forEach(art=>{
      cloud.abos.push(ref.collection("daten").doc(art).onSnapshot({includeMetadataChanges:true}, s=>{
        empfangen(art, s.exists ? s.data().inhalt : null, s.metadata, !s.exists);
      }, e=>{ cloudFehler(e); fehler(e); }));
    });
    ["history","lieferungen"].forEach(art=>{
      cloud.abos.push(ref.collection(art).onSnapshot({includeMetadataChanges:true}, q=>{
        empfangen(art, q.docs.map(d=>({ id:d.id, ...d.data() })), q.metadata, q.empty);
      }, e=>{ cloudFehler(e); fehler(e); }));
    });
    // Eigener Geräte-Eintrag: verschwindet er, wurde dieses Gerät aus dem Betrieb entfernt
    cloud.abos.push(ref.collection("geraete").doc(geraeteUid).onSnapshot(s=>{
      if(!s.exists && !s.metadata.fromCache) geraetEntfernt();
    }, e=>cloudFehler(e)));
  });
}

async function pruefeGeraetNochDa(){
  if(!geraeteUid) return;
  try{
    const z=await db.collection("geraetezuordnung").doc(geraeteUid).get({source:"server"});
    if(!z.exists) geraetEntfernt();
  }catch(e){
    if(e.code==="permission-denied") geraetEntfernt();
  }
}

// Gerät wurde entfernt: Daten des Betriebs von diesem Gerät löschen, Zugangsseite zeigen
async function geraetEntfernt(){
  if(cloud.entfernt) return;
  cloud.entfernt=true;
  cloud.aktiv=false;
  cloud.abos.forEach(a=>a()); cloud.abos=[];
  ["futter","gCfg","history","lager","lieferungen","betriebId"].forEach(k=>localStorage.removeItem(k));
  try{ await db.terminate(); await db.clearPersistence(); }catch(e){}
  alert("Dieses Gerät wurde aus dem Betrieb entfernt.");
  location.reload();
}

function zeigeSyncStatus(zustand){
  const el=document.getElementById("sync-status");
  if(!el) return;
  if(zustand==="laden"){ el.textContent="⏳ lade Daten…"; return; }
  if(zustand==="warte"){ el.textContent="📴 keine Verbindung – bitte einmal mit Internet öffnen"; return; }
  if(!cloud.aktiv){ el.textContent=""; return; }
  const offen = Object.keys(cloud.offen).length>0 || cloud.schreibtGerade;
  el.textContent = !navigator.onLine
    ? (offen ? "📴 offline – wird gespeichert, sobald Netz da ist" : "📴 offline")
    : (offen ? "⏳ speichert…" : "☁️ gespeichert");
}
window.addEventListener("online",()=>zeigeSyncStatus());
window.addEventListener("offline",()=>zeigeSyncStatus());
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") cloudSchreiben(); });
window.addEventListener("pagehide",()=>cloudSchreiben());

// Der Bereich „Betrieb“ erscheint im Tab Einstellungen unter den bisherigen Einstellungen
const _showTabOriginal = showTab;
showTab = function(t){
  _showTabOriginal(t);
  document.getElementById("betrieb").classList.toggle("hidden", t!=="settings");
};

function baueBetriebBereich(){
  const el=document.getElementById("betrieb");
  if(!el) return;
  const alt=localStorage.getItem("datenVorUmbau") && !localStorage.getItem("datenVorUmbauUebernommen");
  el.innerHTML=`
  <hr>
  <h3>Betrieb</h3>
  <div id="betrieb-name">${betriebId ? "" : "–"}</div>
  <div style="font-size:12px;color:#666;margin-top:6px">Gerätekennung: ${geraeteUid||"–"}</div>
  ${alt ? `
  <p style="background:#fff8e1;padding:10px;border-radius:8px">
    Auf diesem Gerät liegen noch Daten von vor dem Umbau (nur auf diesem Gerät, nicht im Betrieb).<br><br>
    <button class="save-btn" onclick="altDatenUebernehmen()">In den Betrieb übernehmen</button>
    <button class="save-btn" onclick="altDatenHerunterladen()">Als Backup herunterladen</button>
  </p>` : ""}
  `;
  if(betriebId){
    db.collection("betriebe").doc(betriebId).get().then(s=>{
      const n=document.getElementById("betrieb-name");
      if(n && s.exists) n.textContent=s.data().name||"";
    }).catch(()=>{});
  }
}

// Sicherheitskopie der Daten, die vor dem Umbau nur auf diesem Gerät lagen
function altDatenSichern(){
  if(localStorage.getItem("betriebId") || localStorage.getItem("datenVorUmbau")) return;
  const hatDaten=["futter","history","lager","lieferungen","gCfg"].some(k=>localStorage.getItem(k));
  if(!hatDaten) return;
  localStorage.setItem("datenVorUmbau", JSON.stringify({
    data, globalCfg, historyData, lagerData, lieferungen, hiddenWarnings, historyCollapsed
  }, null, 2));
}

// Übernahme über die vorhandene Backup-Funktion (wie „Backup laden“ mit der gesicherten Datei)
function altDatenUebernehmen(){
  if(!confirm("Alle Daten des Betriebs durch die alten Daten dieses Geräts ersetzen?\n\nDas gilt für alle Geräte des Betriebs. Vorher am besten „Backup erstellen“.")) return;
  const datei=new File([localStorage.getItem("datenVorUmbau")||"{}"],"futterrechner-backup-vor-umbau.json",{type:"application/json"});
  importBackup({ target:{ files:[datei] } });
  localStorage.setItem("datenVorUmbauUebernommen", new Date().toISOString());
  setTimeout(baueBetriebBereich, 500);
}

function altDatenHerunterladen(){
  const blob=new Blob([localStorage.getItem("datenVorUmbau")||"{}"],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="futterrechner-backup-vor-umbau.json";
  a.click();
}

// Anonyme Geräte-Anmeldung: jedes Gerät bekommt eine feste Kennung (uid)
function anmelden(){
  return new Promise((ok,fehler)=>{
    const stop=auth.onAuthStateChanged(user=>{
      stop();
      if(user) ok(user);
      else auth.signInAnonymously().then(c=>ok(c.user)).catch(fehler);
    }, fehler);
  });
}

function zeigeApp(){
  buildCalc();
  buildSettings();
  buildCalc2();
  buildHistory();
  updateHistoryTabColor();
  baueBetriebBereich();
}

async function starten(){
  zeigeSyncStatus("laden");
  try{
    const user=await anmelden();
    geraeteUid=user.uid;
  }catch(e){
    console.log("Anmeldung fehlgeschlagen:", e);
    zeigeSyncStatus("warte");
    return;
  }

  // Zu welchem Betrieb gehört dieses Gerät?
  let zuordnung=null;
  try{
    const z=await db.collection("geraetezuordnung").doc(geraeteUid).get();
    zuordnung = z.exists ? z.data().betriebId : null;
  }catch(e){
    // ohne Netz und nicht im Zwischenspeicher: bisherigen Betrieb weiter benutzen
    zuordnung = betriebId;
  }

  if(!zuordnung){
    betriebId=null;
    localStorage.removeItem("betriebId");
    zeigeSyncStatus();
    zeigeZugangsseite();
    return;
  }

  altDatenSichern();
  betriebId=zuordnung;
  localStorage.setItem("betriebId",betriebId);
  try{
    await cloudAbonnieren();
  }catch(e){
    console.log("Laden fehlgeschlagen:", e);
    return;
  }
  cloud.aktiv=true;
  zeigeSyncStatus();
  zeigeApp();
}

// Kein Betrieb zugeordnet → Zugang anfragen
function zeigeZugangsseite(){
  showRequestForm();
  const k=document.getElementById("zugang-kennung");
  if(k) k.textContent="Gerätekennung: "+geraeteUid;
}

handleApproval().then(()=>{
  starten();
});
